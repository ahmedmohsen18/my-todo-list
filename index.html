<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f3e9">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>My To Do List</title>
<style>
  :root {
    --paper: #f7f3e9;
    --card: #fffdf7;
    --ink: #2b2620;
    --ink-soft: #6b6259;
    --ink-faint: #a89f93;
    --rule: #d9d2c2;
    --red: #c8553d;
    --red-soft: #e8d5cf;
    --blue: #3d6b8c;
    --blue-soft: #d3dee6;
    --serif: "Iowan Old Style", ui-serif, "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background-color: var(--paper);
    background-image: radial-gradient(circle, #e6dfd0 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--serif);
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .layout {
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 24px 52px;
  }

  /* ── Toolbar ─────────────────────────────── */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .toolbar h1 {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .status-msg {
    flex: 1;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0;
    transition: opacity 0.3s;
    text-align: right;
    padding-right: 4px;
  }
  .status-msg.show { opacity: 1; }
  .toolbar-btn {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 10px 16px;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(43, 38, 32, 0.08);
    transition: color 0.15s, border-color 0.15s;
  }
  .toolbar-btn:hover { color: var(--ink); border-color: var(--ink-faint); }

  /* ── Panels ──────────────────────────────── */
  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    align-items: start;
  }
  /* ── Pull-to-refresh indicator ───────────── */
  .ptr-indicator {
    position: fixed;
    top: -54px;
    left: 50%;
    width: 40px;
    height: 40px;
    margin-left: -20px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 50%;
    box-shadow: 0 2px 10px rgba(43, 38, 32, 0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: var(--ink-soft);
    z-index: 20;
    pointer-events: none;
  }
  .ptr-indicator.snap { transition: top 0.2s ease; }
  .ptr-indicator .ptr-arrow { transition: transform 0.15s; }
  .ptr-indicator.ready .ptr-arrow { color: var(--red); }
  .ptr-indicator.spinning .ptr-arrow { animation: ptr-spin 0.8s linear infinite; }
  @keyframes ptr-spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .panel {
    background: var(--card);
    border-radius: 4px;
    border-top: 4px solid;
    box-shadow: 0 2px 12px rgba(43, 38, 32, 0.1);
    padding: 34px 34px 20px;
    display: flex;
    flex-direction: column;
    min-height: 420px;
  }
  .panel.personal { border-top-color: var(--red); }
  .panel.business { border-top-color: var(--blue); }

  .panel-header .panel-title {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .panel-title .dot { font-weight: 700; }
  .panel.personal .dot { color: var(--red); }
  .panel.business .dot { color: var(--blue); }
  .panel-header .panel-subtitle {
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-top: 6px;
  }
  .panel-header .divider {
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    height: 4px;
    margin: 16px 0 20px;
  }

  /* ── Add row ─────────────────────────────── */
  .add-row {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
  }
  .add-input {
    flex: 1;
    font-family: var(--serif);
    font-style: italic;
    font-size: 16px;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--rule);
    border-radius: 4px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  .panel.personal .add-input:focus { border-color: var(--red); }
  .panel.business .add-input:focus { border-color: var(--blue); }
  .add-input::placeholder { color: var(--ink-faint); font-style: italic; }
  .add-btn {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 0 22px;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(43, 38, 32, 0.15);
    transition: filter 0.15s;
  }
  .panel.personal .add-btn { background: var(--red); }
  .panel.business .add-btn { background: var(--blue); }
  .add-btn:hover { filter: brightness(1.08); }

  /* ── Task list ───────────────────────────── */
  .task-list { list-style: none; flex: 1; }
  .task-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 16px 2px;
    border-bottom: 1px solid var(--rule);
    animation: slide-in 0.25s ease;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .task-circle {
    flex: none;
    width: 22px;
    height: 22px;
    margin-top: 1px;
    border: 2px solid;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .panel.personal .task-circle { border-color: var(--red); }
  .panel.business .task-circle { border-color: var(--blue); }
  .panel.personal .task-circle:hover { background: var(--red-soft); }
  .panel.business .task-circle:hover { background: var(--blue-soft); }

  .task-body { flex: 1; min-width: 0; }
  .task-text {
    font-size: 17px;
    line-height: 1.45;
    cursor: text;
    word-wrap: break-word;
  }
  .task-edit {
    width: 100%;
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 2px 6px;
    outline: none;
  }
  .task-meta {
    font-family: var(--sans);
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  /* ── Due dates ───────────────────────────── */
  .due-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .due-label {
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
  }
  .due-input {
    flex: 1;
    min-width: 0;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-soft);
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 6px 8px;
    outline: none;
  }
  .task-due { cursor: pointer; }
  .task-due.today { color: #b3701f; font-weight: 700; }
  .task-due.overdue { color: var(--red); font-weight: 700; }
  .due-bell {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 12px;
    padding: 0 4px;
    vertical-align: baseline;
  }
  .task-datebtn {
    flex: none;
    font-size: 14px;
    line-height: 1;
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .task-row:hover .task-datebtn { opacity: 1; }
  .due-edit-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 5px;
  }
  .due-edit-row .due-input { flex: 1; }
  .due-clear {
    font-family: var(--sans);
    font-size: 10px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 5px 8px;
    cursor: pointer;
  }

  .task-delete {
    flex: none;
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 6px;
    margin-top: -1px;
    opacity: 0;
    transition: opacity 0.15s, color 0.15s;
  }
  .task-row:hover .task-delete { opacity: 1; }
  .task-delete:hover { color: var(--red); }

  .empty-state {
    font-style: italic;
    font-size: 15px;
    color: var(--ink-faint);
    padding: 26px 2px;
  }

  /* ── Completed drawer ────────────────────── */
  .completed-section { margin-top: 14px; }
  .completed-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: none;
    border: none;
    cursor: pointer;
    padding: 12px 2px;
  }
  .panel.personal .completed-toggle { color: var(--red); }
  .panel.business .completed-toggle { color: var(--blue); }
  .completed-toggle .arrow {
    display: inline-block;
    font-size: 9px;
    transition: transform 0.2s;
  }
  .completed-section.open .arrow { transform: rotate(90deg); }
  .completed-toggle .count-badge {
    margin-left: auto;
    font-size: 10px;
    color: var(--ink);
    border-radius: 10px;
    padding: 3px 9px;
  }
  .panel.personal .count-badge { background: #eebf8f; }
  .panel.business .count-badge { background: #a8c4d8; }

  .completed-list { list-style: none; display: none; }
  .completed-section.open .completed-list { display: block; }
  .completed-section .empty-state { display: none; padding: 12px 2px 16px; }
  .completed-section.open .empty-state.visible { display: block; }

  .completed-list .task-text {
    text-decoration: line-through;
    color: var(--ink-soft);
    cursor: default;
  }
  .completed-list .task-circle {
    border-color: var(--ink-faint);
    background: var(--ink-faint);
  }
  .completed-list .task-circle:hover { background: var(--card); }

  /* ── Panel footer ────────────────────────── */
  .panel-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--rule);
    margin-top: 4px;
    padding: 16px 2px 8px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .clear-completed {
    color: var(--ink-soft);
    background: none;
    border: none;
    font-family: var(--sans);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    transition: color 0.15s;
  }
  .clear-completed:hover { color: var(--red); }

  /* ── Export modal ────────────────────────── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(43, 38, 32, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 10;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 4px;
    box-shadow: 0 8px 40px rgba(43, 38, 32, 0.35);
    max-width: 560px;
    width: 100%;
    padding: 28px;
  }
  .modal h2 { font-size: 22px; margin-bottom: 8px; }
  .modal p {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .modal textarea {
    width: 100%;
    height: 220px;
    font-family: Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 12px;
    resize: vertical;
    outline: none;
  }
  .modal .modal-actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 14px;
  }

  /* Phones (iPhone 16 Pro & co.): keep the two lists side by side, just compact.
     NOTE: must stay AFTER the base rules — equal specificity, cascade order decides.
     Inputs stay at 16px so iOS Safari doesn't zoom-jump when they're focused.
     Small running text switches to the system sans (SF on iPhone) — the serif
     stays for panel titles, where it carries the paper look best. */
  @media (max-width: 720px) {
    .layout {
      padding: calc(10px + env(safe-area-inset-top, 0px))
               max(8px, env(safe-area-inset-left, 0px))
               calc(52px + env(safe-area-inset-bottom, 0px))
               max(8px, env(safe-area-inset-right, 0px));
    }
    .toolbar { flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .toolbar h1 { font-size: 11px; letter-spacing: 2.5px; }
    .toolbar-btn { padding: 9px 11px; font-size: 9px; letter-spacing: 1px; border-radius: 7px; }
    .panels { gap: 8px; }
    .panel {
      padding: 15px 12px 8px;
      min-height: 0;
      min-width: 0;
      border-radius: 10px;
      border-top-width: 3px;
    }
    .panel-header .panel-title { font-size: 22px; letter-spacing: 0.2px; }
    .panel-header .panel-subtitle { font-size: 8px; letter-spacing: 1.6px; margin-top: 3px; }
    .panel-header .divider { margin: 10px 0 12px; }
    .add-row { gap: 6px; margin-bottom: 6px; }
    .add-input { font-size: 16px; padding: 8px 10px; border-radius: 8px; }
    .add-btn { padding: 0 12px; font-size: 10px; letter-spacing: 1px; border-radius: 8px; }
    .due-row { gap: 5px; margin-bottom: 4px; }
    .due-label { font-size: 8px; letter-spacing: 0.5px; }
    .due-input { font-size: 16px; padding: 4px 6px; border-radius: 7px; }
    .task-row { gap: 9px; padding: 12px 0; }
    .task-circle { width: 19px; height: 19px; border-width: 1.5px; margin-top: 0; }
    .task-text { font-family: var(--sans); font-size: 13px; line-height: 1.45; }
    .task-edit { font-family: var(--sans); font-size: 16px; }
    .task-meta { font-size: 10px; margin-top: 3px; }
    .due-bell { font-size: 11px; }
    .task-datebtn { font-size: 13px; padding: 4px; }
    .task-delete { font-size: 15px; padding: 4px 5px; }
    .due-clear { font-size: 10px; padding: 5px 7px; }
    .empty-state { font-size: 12px; padding: 16px 0; }
    .completed-toggle { font-size: 9px; letter-spacing: 1.3px; gap: 5px; padding: 10px 0; }
    .completed-toggle .count-badge { font-size: 9px; padding: 2px 7px; }
    .panel-footer, .clear-completed { font-size: 10px; }
  }

  /* Touch screens: no hover, so keep row buttons visible */
  @media (hover: none) {
    .task-delete, .task-datebtn { opacity: 1; }
  }

  /* ── Print ───────────────────────────────── */
  @media print {
    html, body { background: #fff; }
    .toolbar-btn, .add-row, .due-row, .task-delete, .task-datebtn, .due-bell, .clear-completed, .status-msg, .modal-overlay, .ptr-indicator { display: none !important; }
    .panel { box-shadow: none; border: 1px solid var(--rule); break-inside: avoid; }
    .panels { gap: 16px; }
  }
</style>
</head>
<body>
<div class="layout">

  <div class="toolbar">
    <h1>My Lists</h1>
    <span class="status-msg" id="status-msg"></span>
    <button class="toolbar-btn" id="export-btn">Export backup</button>
    <button class="toolbar-btn" id="import-btn">Import backup</button>
  </div>

  <div class="panels" id="panels"></div>

</div>

<div class="modal-overlay" id="export-modal">
  <div class="modal">
    <h2>Backup JSON</h2>
    <p>Copy the text below and save it somewhere safe. You can paste it back later with “Import backup”.</p>
    <textarea id="export-json" readonly></textarea>
    <div class="modal-actions">
      <button class="toolbar-btn" id="export-modal-close">Close</button>
    </div>
  </div>
</div>

<input type="file" id="import-file" accept="application/json,.json" style="display:none">

<div class="ptr-indicator" id="ptr-indicator"><span class="ptr-arrow">↻</span></div>

<script>
(function () {
  "use strict";

  var PANELS = [
    { id: "personal", title: "Personal", subtitle: "Life & Home", storageKey: "dia_todo_personal_v1" },
    { id: "business", title: "Business", subtitle: "Work & Projects", storageKey: "dia_todo_business_v1" }
  ];

  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  // ── Seed data (loaded once, only if a list has never been saved) ──

  var SEED_DONE_AT = new Date(2026, 6, 28, 19, 0).getTime();   // Jul 28 at 7:00 PM
  var SEED = {
    dia_todo_personal_v1: [
      { text: "Buy Miha's Ticket", done: false },
      { text: "Book Accomodation", done: false },
      { text: "Shirt for KK", done: false },
      { text: "Buy Dalia's & Fifa's Tickets", done: true, completedAt: new Date(2026, 6, 28, 18, 57).getTime() }
    ],
    dia_todo_business_v1: [
      { text: "New Merchants at Partner — 2b: 75k per month for 3 locations, nothing sent yet (Ahmed Abdelraouf, due 05/21/2026)", done: false },
      { text: "Morshedy 3 locations activation at partner for free", done: false },
      { text: "Raneen 3 places — Imbaba + Shubra Masr + Tanta + Abohawa 1", done: false },
      { text: "kickoff an initiative on docs experience optimization", done: false },
      { text: "Call centre to call awaiting activation knowing their limits and ask them would they agree to 25% of the limit without going to the branch?", done: false },
      { text: "offers from Bosta + Mylerz + Aramex", done: false },
      { text: "Thank you incentive for Makahzen people for working with mylo", done: false },
      { text: "Quality Program Comments — move remaining supplies from old office (Hend Mohamed)", done: true, completedAt: SEED_DONE_AT },
      { text: "mylo One — get approval from team managers (Ahmed Abdelraouf)", done: true, completedAt: SEED_DONE_AT },
      { text: "Bi-Weekly session with agents to get their feedback — align with mylo one area managers for rotation-by-location feedback (Hend Mohamed)", done: true, completedAt: SEED_DONE_AT },
      { text: "Work to have flyers inside the activation points — design with Eslam and team (Eslam Eltantawy, due 05/24/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Talk with Maha regarding the guy to leave to waive the 30k (Maha Gunied)", done: true, completedAt: SEED_DONE_AT },
      { text: "Talking Points with Abdelraouf — June/July branches, podiums, t-shirts, mini needs", done: true, completedAt: SEED_DONE_AT },
      { text: "Schedule Parlex Meeting (Ahmed Mohsen, due 05/21/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Send thanks shoutout to Abdelrahman & Walid Helmy + another for Osman and Networks team (due 05/30/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Nok Payments with Hatem (due 05/15/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Send to Eslam podium and t-shirts needs — 42 podiums and 300 t-shirts (Eslam Eltantawy, due 05/17/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Activation @ Partner analysis (Rahma Alaa)", done: true, completedAt: SEED_DONE_AT },
      { text: "Follow up on Dream2000 2B activation points — no response received yet (Ahmed Mohsen, due 05/28/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Cold sales call plan for Moto — prepare and share for Moto activation (Ahmed Mohsen, due 05/29/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Follow up on unresponded thread in #general-ops — follow up if no response by EOW (Ahmed Mohsen, due 05/28/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Follow up on Piloting Timeline thread — no reply received yet (Ahmed Mohsen, due 05/28/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Follow up on activation rollout update (Mohamed Osman thread) — awaiting response (Ahmed Mohsen, due 05/29/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Cards Roadmap", done: true, completedAt: SEED_DONE_AT },
      { text: "Work on a unified process for outbound calls for all teams (Ahmed Mohsen, due 07/11/2026)", done: true, completedAt: SEED_DONE_AT },
      { text: "Score Cards to be live + new recognition program with People (Ahmed Mohsen, due 07/20/2026)", done: true, completedAt: SEED_DONE_AT }
    ]
  };

  Object.keys(SEED).forEach(function (key) {
    if (localStorage.getItem(key) === null) {
      localStorage.setItem(key, JSON.stringify(SEED[key]));
    }
  });

  // ── Storage ──────────────────────────────────────────────

  function loadTasks(key) {
    try {
      var raw = localStorage.getItem(key);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (t) {
        return t && typeof t.text === "string";
      }).map(function (t) {
        var task = { text: t.text, done: !!t.done };
        if (t.done && typeof t.completedAt === "number") task.completedAt = t.completedAt;
        if (typeof t.due === "number") task.due = t.due;
        if (t.notified) task.notified = true;
        return task;
      });
    } catch (e) {
      return [];
    }
  }

  function saveTasks(key, tasks) {
    localStorage.setItem(key, JSON.stringify(tasks));
  }

  // ── Helpers ──────────────────────────────────────────────

  function formatDateTime(ts) {
    var d = new Date(ts);
    var hours = d.getHours();
    var ampm = hours >= 12 ? "PM" : "AM";
    hours = hours % 12;
    if (hours === 0) hours = 12;
    var minutes = String(d.getMinutes()).padStart(2, "0");
    return MONTHS[d.getMonth()] + " " + d.getDate() + " at " + hours + ":" + minutes + " " + ampm;
  }

  function formatCompletedAt(ts) {
    return "Completed " + formatDateTime(ts);
  }

  // Local "YYYY-MM-DDTHH:MM" for <input type="datetime-local">
  function toLocalInputValue(ts) {
    var d = new Date(ts);
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0") + "T" +
      String(d.getHours()).padStart(2, "0") + ":" +
      String(d.getMinutes()).padStart(2, "0");
  }

  function isSameDay(a, b) {
    var da = new Date(a), db = new Date(b);
    return da.getFullYear() === db.getFullYear() &&
      da.getMonth() === db.getMonth() &&
      da.getDate() === db.getDate();
  }

  function ensureNotifyPermission() {
    if ("Notification" in window && Notification.permission === "default") {
      Notification.requestPermission();
    }
  }

  // .ics calendar event with an alert — the reliable way to get a real
  // notification on an iPhone from a serverless page.
  function downloadReminderICS(task, listTitle) {
    function icsEscape(s) {
      return s.replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
    }
    function icsLocal(ts) {
      return toLocalInputValue(ts).replace(/[-:]/g, "");
    }
    var uid = "task-" + task.due + "-" + Math.abs(task.text.split("").reduce(function (h, c) {
      return (h * 31 + c.charCodeAt(0)) | 0;
    }, 0)) + "@dia-todo";
    var lines = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "PRODID:-//dia-todo//EN",
      "BEGIN:VEVENT",
      "UID:" + uid,
      "DTSTAMP:" + icsLocal(Date.now()) + "00",
      "DTSTART:" + icsLocal(task.due) + "00",
      "DTEND:" + icsLocal(task.due + 30 * 60 * 1000) + "00",
      "SUMMARY:" + icsEscape("To do: " + task.text),
      "DESCRIPTION:" + icsEscape("From My To Do List (" + listTitle + ")"),
      "BEGIN:VALARM",
      "ACTION:DISPLAY",
      "DESCRIPTION:" + icsEscape(task.text),
      "TRIGGER:-PT0M",
      "END:VALARM",
      "END:VEVENT",
      "END:VCALENDAR"
    ];
    var blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "reminder.ics";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  var statusTimer = null;
  function flashStatus(message) {
    var node = document.getElementById("status-msg");
    node.textContent = message;
    node.classList.add("show");
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { node.classList.remove("show"); }, 3000);
  }

  // ── Panel ────────────────────────────────────────────────

  function createPanel(config) {
    var tasks = loadTasks(config.storageKey);
    var completedOpen = false;

    var panel = el("section", "panel " + config.id);

    // Header
    var header = el("div", "panel-header");
    var title = el("h2", "panel-title", config.title);
    title.appendChild(el("span", "dot", "."));
    header.appendChild(title);
    header.appendChild(el("div", "panel-subtitle", config.subtitle));
    header.appendChild(el("div", "divider"));
    panel.appendChild(header);

    // Add row
    var addRow = el("div", "add-row");
    var addInput = el("input", "add-input");
    addInput.type = "text";
    addInput.placeholder = "What needs doing?";
    var addBtn = el("button", "add-btn", "Add");
    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    panel.appendChild(addRow);

    // Optional due date & time for the next task added
    var dueRow = el("div", "due-row");
    dueRow.appendChild(el("label", "due-label", "Due / remind"));
    var dueInput = el("input", "due-input");
    dueInput.type = "datetime-local";
    dueInput.addEventListener("change", ensureNotifyPermission);
    dueRow.appendChild(dueInput);
    panel.appendChild(dueRow);

    // Active list
    var activeList = el("ul", "task-list");
    panel.appendChild(activeList);

    // Completed drawer
    var completedSection = el("div", "completed-section");
    var toggle = el("button", "completed-toggle");
    toggle.appendChild(el("span", "arrow", "▶"));
    toggle.appendChild(el("span", null, "Completed"));
    var countBadge = el("span", "count-badge", "0");
    toggle.appendChild(countBadge);
    completedSection.appendChild(toggle);
    var completedEmpty = el("div", "empty-state", "No completed tasks yet.");
    var completedList = el("ul", "completed-list");
    completedSection.appendChild(completedEmpty);
    completedSection.appendChild(completedList);
    panel.appendChild(completedSection);

    // Footer
    var footer = el("div", "panel-footer");
    var countLabel = el("span", null, "0 to do");
    var clearBtn = el("button", "clear-completed", "Clear completed");
    footer.appendChild(countLabel);
    footer.appendChild(clearBtn);
    panel.appendChild(footer);

    function persist() {
      saveTasks(config.storageKey, tasks);
    }

    function addTask() {
      var text = addInput.value.trim();
      if (!text) return;
      var task = { text: text, done: false };
      if (dueInput.value) {
        var ts = new Date(dueInput.value).getTime();
        if (!isNaN(ts)) task.due = ts;
      }
      tasks.push(task);
      addInput.value = "";
      dueInput.value = "";
      persist();
      render();
      addInput.focus();
    }

    function startEdit(task, textNode) {
      var input = el("input", "task-edit");
      input.type = "text";
      input.value = task.text;
      var finished = false;

      function commit() {
        if (finished) return;
        finished = true;
        var value = input.value.trim();
        if (value) task.text = value;
        persist();
        render();
      }
      function cancel() {
        if (finished) return;
        finished = true;
        render();
      }

      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") commit();
        else if (e.key === "Escape") cancel();
      });
      input.addEventListener("blur", commit);

      textNode.replaceWith(input);
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }

    function startDueEdit(task, body) {
      var existing = body.querySelector(".due-edit-row");
      if (existing) { existing.remove(); return; }

      var editRow = el("div", "due-edit-row");
      var input = el("input", "due-input");
      input.type = "datetime-local";
      if (task.due) input.value = toLocalInputValue(task.due);
      var clearBtn = el("button", "due-clear", task.due ? "Clear" : "Cancel");

      function commit() {
        if (input.value) {
          var ts = new Date(input.value).getTime();
          if (!isNaN(ts)) {
            task.due = ts;
            delete task.notified;
          }
        } else {
          delete task.due;
          delete task.notified;
        }
        persist();
        render();
      }

      input.addEventListener("change", ensureNotifyPermission);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") commit();
        else if (e.key === "Escape") render();
      });
      var saveBtn = el("button", "due-clear", "Save");
      saveBtn.addEventListener("click", commit);
      clearBtn.addEventListener("click", function () {
        input.value = "";
        commit();
      });

      editRow.appendChild(input);
      editRow.appendChild(saveBtn);
      editRow.appendChild(clearBtn);
      body.appendChild(editRow);
      input.focus();
    }

    function buildRow(task) {
      var row = el("li", "task-row");

      var circle = el("button", "task-circle");
      circle.title = task.done ? "Retrieve task" : "Complete task";
      circle.addEventListener("click", function () {
        if (task.done) {
          task.done = false;
          delete task.completedAt;
        } else {
          task.done = true;
          task.completedAt = Date.now();
        }
        persist();
        render();
      });
      row.appendChild(circle);

      var body = el("div", "task-body");
      var textNode = el("div", "task-text", task.text);
      body.appendChild(textNode);
      if (task.done && task.completedAt) {
        body.appendChild(el("div", "task-meta", formatCompletedAt(task.completedAt)));
      }
      if (!task.done && task.due) {
        var now = Date.now();
        var dueClass = "task-meta task-due";
        if (task.due < now) dueClass += " overdue";
        else if (isSameDay(task.due, now)) dueClass += " today";
        var dueMeta = el("div", dueClass);
        var dueText = el("span", null,
          (task.due < now ? "Overdue — was due " : "Due ") + formatDateTime(task.due));
        dueText.title = "Change date";
        dueText.addEventListener("click", function () { startDueEdit(task, body); });
        dueMeta.appendChild(dueText);
        var bell = el("button", "due-bell", "🔔");
        bell.title = "Add reminder to your Calendar (fires a real iPhone notification)";
        bell.addEventListener("click", function () { downloadReminderICS(task, config.title); });
        dueMeta.appendChild(bell);
        body.appendChild(dueMeta);
      }
      if (!task.done) {
        textNode.addEventListener("click", function () { startEdit(task, textNode); });
      }
      row.appendChild(body);

      if (!task.done) {
        var dateBtn = el("button", "task-datebtn", "📅");
        dateBtn.title = task.due ? "Change due date" : "Set due date & reminder";
        dateBtn.addEventListener("click", function () { startDueEdit(task, body); });
        row.appendChild(dateBtn);
      }

      var del = el("button", "task-delete", "×");
      del.title = "Delete task";
      del.addEventListener("click", function () {
        tasks.splice(tasks.indexOf(task), 1);
        persist();
        render();
      });
      row.appendChild(del);

      return row;
    }

    function render() {
      var active = tasks.filter(function (t) { return !t.done; });
      var completed = tasks.filter(function (t) { return t.done; });

      // Tasks with a due date float to the top, soonest first;
      // undated tasks keep their original order below them.
      active.sort(function (a, b) {
        if (a.due && b.due) return a.due - b.due;
        if (a.due) return -1;
        if (b.due) return 1;
        return 0;
      });

      activeList.textContent = "";
      if (active.length === 0) {
        activeList.appendChild(el("li", "empty-state", "Nothing here yet. Add your first task above."));
      } else {
        active.forEach(function (task) { activeList.appendChild(buildRow(task)); });
      }

      completedList.textContent = "";
      completed.forEach(function (task) { completedList.appendChild(buildRow(task)); });
      completedEmpty.classList.toggle("visible", completed.length === 0);

      countBadge.textContent = String(completed.length);
      countLabel.textContent = active.length + " to do";
      completedSection.classList.toggle("open", completedOpen);
    }

    addBtn.addEventListener("click", addTask);
    addInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") addTask();
    });
    toggle.addEventListener("click", function () {
      completedOpen = !completedOpen;
      render();
    });
    clearBtn.addEventListener("click", function () {
      tasks = tasks.filter(function (t) { return !t.done; });
      persist();
      render();
    });

    // While the page is open: fire a notification (where supported) the
    // moment a task's due time passes, and keep overdue styling fresh.
    function checkDue() {
      var now = Date.now();
      var changed = false;
      tasks.forEach(function (t) {
        if (t.done || !t.due || t.due > now || t.notified) return;
        t.notified = true;
        changed = true;
        if ("Notification" in window && Notification.permission === "granted") {
          try {
            new Notification(config.title + ": " + t.text, {
              body: "Was due " + formatDateTime(t.due)
            });
          } catch (e) { /* some platforms only allow notifications via service workers */ }
        }
        flashStatus("Due now: " + t.text);
      });
      if (changed) {
        persist();
        // Don't re-render over an open inline editor
        if (!panel.querySelector(".task-edit, .due-edit-row")) render();
      }
    }
    setInterval(checkDue, 30000);
    checkDue();

    render();
    return panel;
  }

  var panelsRoot = document.getElementById("panels");
  PANELS.forEach(function (config) {
    panelsRoot.appendChild(createPanel(config));
  });

  // ── Export ───────────────────────────────────────────────

  function buildBackup() {
    return {
      app: "dia-todo",
      version: 1,
      exportedAt: new Date().toISOString(),
      lists: {
        personal: loadTasks("dia_todo_personal_v1"),
        business: loadTasks("dia_todo_business_v1")
      }
    };
  }

  function tryDownload(json, filename) {
    try {
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      return true;
    } catch (e) {
      return false;
    }
  }

  function showExportModal(json) {
    var overlay = document.getElementById("export-modal");
    var textarea = document.getElementById("export-json");
    textarea.value = json;
    overlay.classList.add("show");
    textarea.focus();
    textarea.select();
  }

  document.getElementById("export-modal-close").addEventListener("click", function () {
    document.getElementById("export-modal").classList.remove("show");
  });

  document.getElementById("export-btn").addEventListener("click", function () {
    var json = JSON.stringify(buildBackup(), null, 2);
    var d = new Date();
    var filename = "todo-backup-" + d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0") + ".json";

    var downloaded = tryDownload(json, filename);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(json).then(function () {
        flashStatus(downloaded ? "Backup downloaded and copied to clipboard." : "Backup copied to clipboard.");
      }, function () {
        if (!downloaded) showExportModal(json);
        else flashStatus("Backup downloaded.");
      });
    } else if (downloaded) {
      flashStatus("Backup downloaded.");
    } else {
      showExportModal(json);
    }
  });

  // ── Import ───────────────────────────────────────────────

  function applyImport(text) {
    var data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      alert("That doesn't look like valid JSON. Import cancelled.");
      return;
    }
    if (!data || typeof data !== "object" || !data.lists || typeof data.lists !== "object") {
      alert("Invalid backup: missing a \"lists\" object. Import cancelled.");
      return;
    }
    var personal = Array.isArray(data.lists.personal) ? data.lists.personal : [];
    var business = Array.isArray(data.lists.business) ? data.lists.business : [];
    var total = personal.length + business.length;

    var ok = confirm(
      "Import " + total + " task" + (total === 1 ? "" : "s") +
      " (" + personal.length + " personal, " + business.length + " business)?\n\n" +
      "Warning: this REPLACES your current lists."
    );
    if (!ok) return;

    localStorage.setItem("dia_todo_personal_v1", JSON.stringify(personal));
    localStorage.setItem("dia_todo_business_v1", JSON.stringify(business));
    location.reload();
  }

  var importFileInput = document.getElementById("import-file");
  importFileInput.addEventListener("change", function () {
    var file = importFileInput.files[0];
    importFileInput.value = "";
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { applyImport(String(reader.result)); };
    reader.readAsText(file);
  });

  document.getElementById("import-btn").addEventListener("click", function () {
    var useFile = confirm("Import backup:\n\nOK — choose a backup file\nCancel — paste the JSON text instead");
    if (useFile) {
      importFileInput.click();
    } else {
      var text = prompt("Paste your backup JSON here:");
      if (text) applyImport(text);
    }
  });

  // ── Pull-to-refresh (touch devices) ──────────────────────

  (function () {
    var THRESHOLD = 75; // px of pull needed to trigger a refresh
    var indicator = document.getElementById("ptr-indicator");
    var arrow = indicator.querySelector(".ptr-arrow");
    var startY = null;
    var pulling = false;
    var refreshing = false;

    function atTop() {
      return (document.scrollingElement || document.documentElement).scrollTop <= 0;
    }

    document.addEventListener("touchstart", function (e) {
      if (refreshing || !atTop()) return;
      startY = e.touches[0].clientY;
      pulling = true;
      indicator.classList.remove("snap");
    }, { passive: true });

    document.addEventListener("touchmove", function (e) {
      if (!pulling || refreshing || startY === null) return;
      var dy = e.touches[0].clientY - startY;
      if (dy <= 0 || !atTop()) {
        indicator.style.top = "-54px";
        indicator.classList.remove("ready");
        return;
      }
      var pull = Math.min(dy * 0.5, 110);
      indicator.style.top = (pull - 48) + "px";
      arrow.style.transform = "rotate(" + pull * 3 + "deg)";
      indicator.classList.toggle("ready", dy >= THRESHOLD);
    }, { passive: true });

    document.addEventListener("touchend", function (e) {
      if (!pulling || refreshing || startY === null) return;
      var dy = e.changedTouches[0].clientY - startY;
      pulling = false;
      startY = null;
      indicator.classList.add("snap");
      if (dy >= THRESHOLD && atTop()) {
        refreshing = true;
        indicator.classList.add("spinning");
        indicator.style.top = "14px";
        setTimeout(function () { location.reload(); }, 350);
      } else {
        indicator.classList.remove("ready");
        indicator.style.top = "-54px";
      }
    }, { passive: true });
  })();
})();
</script>
</body>
</html>
